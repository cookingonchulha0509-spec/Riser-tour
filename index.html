<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Cam - HDR & Flagship Look</title>
    <style>
        /* Premium Dark Theme - Clean and Sleek */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background-color: #050505; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Camera Viewfinder */
        #viewfinder { flex: 1; position: relative; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; object-fit: cover; }
        canvas { display: none; } /* Hidden, used for processing */
        
        /* Result Image Overlay */
        #result-view { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; background: #000; }
        #result-img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Controls UI */
        #controls-container { background: #121212; border-top: 1px solid #2a2a2a; padding: 15px 10px 30px 10px; z-index: 20; display: flex; flex-direction: column; gap: 20px; }
        
        /* Mode Selector */
        .mode-scroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 5px; justify-content: center; scrollbar-width: none; }
        .mode-scroll::-webkit-scrollbar { display: none; }
        .mode-btn { background: #1e1e1e; border: 1px solid #333; color: #aaa; padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; white-space: nowrap; }
        .mode-btn.active { background: #ffffff; color: #000000; border-color: #ffffff; }
        
        /* Action Buttons */
        .action-bar { display: flex; justify-content: space-around; align-items: center; }
        .side-btn { background: transparent; border: none; color: #fff; font-size: 16px; font-weight: 500; cursor: pointer; padding: 10px; opacity: 0.8; }
        
        /* The Shutter Button */
        #shutter-btn { width: 75px; height: 75px; border-radius: 50%; background: #fff; border: 5px solid #333; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: transform 0.1s; }
        #shutter-btn:active { transform: scale(0.9); background: #e0e0e0; }
        #shutter-inner { width: 55px; height: 55px; border-radius: 50%; background: #fff; border: 1px solid #ddd; }
        
        /* Notification Toast */
        #toast { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 14px; display: none; z-index: 30; }
    </style>
</head>
<body>

    <div id="toast">Processing...</div>

    <div id="viewfinder">
        <video id="camera-stream" autoplay playsinline></video>
        <canvas id="process-canvas"></canvas>
        
        <div id="result-view">
            <img id="result-img" alt="Captured Photo">
        </div>
    </div>

    <div id="controls-container">
        <div class="mode-scroll" id="mode-selector">
            <button class="mode-btn active" data-filter="normal">Normal</button>
            <button class="mode-btn" data-filter="s24">Samsung S24</button>
            <button class="mode-btn" data-filter="apple">iPhone Look</button>
            <button class="mode-btn" data-filter="hdr">Tagda HDR</button>
        </div>

        <div class="action-bar">
            <button class="side-btn" id="retake-btn" style="visibility: hidden;">Retake</button>
            <div id="shutter-btn"><div id="shutter-inner"></div></div>
            <button class="side-btn" id="save-btn" style="visibility: hidden;">Save</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('camera-stream');
        const canvas = document.getElementById('process-canvas');
        const ctx = canvas.getContext('2d');
        const shutterBtn = document.getElementById('shutter-btn');
        const retakeBtn = document.getElementById('retake-btn');
        const saveBtn = document.getElementById('save-btn');
        const resultView = document.getElementById('result-view');
        const resultImg = document.getElementById('result-img');
        const modeBtns = document.querySelectorAll('.mode-btn');
        const toast = document.getElementById('toast');

        let currentFilter = 'normal';
        let stream;

        // Camera Setup (Back Camera Preferred)
        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } 
                });
                video.srcObject = stream;
            } catch (err) {
                alert("Camera access denied or not available!");
                console.error(err);
            }
        }

        // Mode Selection
        modeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                modeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.getAttribute('data-filter');
                
                // Live preview filter apply karna (Performance halki rakhne ke liye basic preview)
                if(currentFilter === 's24') video.style.filter = "saturate(1.4) contrast(1.1)";
                else if(currentFilter === 'apple') video.style.filter = "sepia(0.2) contrast(1.1) brightness(0.95)";
                else if(currentFilter === 'hdr') video.style.filter = "saturate(1.3) contrast(1.2) brightness(1.1)";
                else video.style.filter = "none";
            });
        });

        // The "Tagda" Processing Engine
        function applyEngineFilter() {
            // Yeh filters canvas par lagte hain jab photo click hoti hai, bina phone hang kiye.
            switch (currentFilter) {
                case 's24':
                    // Samsung jaisa punchy color aur sharp contrast
                    ctx.filter = 'saturate(150%) contrast(115%) brightness(105%)';
                    break;
                case 'apple':
                    // iPhone jaisa warm aur natural cinematic tone
                    ctx.filter = 'sepia(20%) saturate(110%) contrast(110%) brightness(95%)';
                    break;
                case 'hdr':
                    // Fake HDR: Fake dynamic range boost
                    ctx.filter = 'saturate(140%) contrast(125%) brightness(115%) drop-shadow(0 0 2px rgba(255,255,255,0.1))';
                    break;
                default:
                    ctx.filter = 'none';
            }
        }

        // Capture Photo
        shutterBtn.addEventListener('click', () => {
            if (!stream) return;
            
            // UI Update
            toast.style.display = 'block';
            setTimeout(() => {
                // Set canvas size match video resolution
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                
                // Apply our Fake HDR / LUT logic
                applyEngineFilter();
                
                // Draw frame to canvas (Processing step)
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // Get image data
                const finalImage = canvas.toDataURL('image/jpeg', 0.95);
                resultImg.src = finalImage;
                
                // Show Result UI
                resultView.style.display = 'block';
                shutterBtn.style.visibility = 'hidden';
                retakeBtn.style.visibility = 'visible';
                saveBtn.style.visibility = 'visible';
                toast.style.display = 'none';
                document.getElementById('mode-selector').style.opacity = '0.3';
                document.getElementById('mode-selector').style.pointerEvents = 'none';
            }, 100); // Small delay to let UI show toast
        });

        // Retake Photo
        retakeBtn.addEventListener('click', () => {
            resultView.style.display = 'none';
            shutterBtn.style.visibility = 'visible';
            retakeBtn.style.visibility = 'hidden';
            saveBtn.style.visibility = 'hidden';
            document.getElementById('mode-selector').style.opacity = '1';
            document.getElementById('mode-selector').style.pointerEvents = 'auto';
        });

        // Save Photo to Device
        saveBtn.addEventListener('click', () => {
            const a = document.createElement('a');
            a.href = resultImg.src;
            a.download = `ProCam_${currentFilter}_${Date.now()}.jpg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });

        // Start everything
        window.addEventListener('load', startCamera);
    </script>
</body>
</html>
