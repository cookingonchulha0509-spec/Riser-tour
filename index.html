<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AETHER | Hologram Transfer</title>
    
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #030a10;
            --accent: #00f0ff;
            --accent-glow: rgba(0, 240, 255, 0.5);
            --text-main: #e0e0e0;
            --font-main: 'Share Tech Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: var(--font-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            perspective: 1200px;
        }

        /* --- Sci-Fi Grid Background --- */
        .scifi-grid {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            background-position: center center;
            z-index: 1;
            pointer-events: none;
        }

        /* --- UI Screens --- */
        .screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            z-index: 100;
            background: radial-gradient(circle at center, #0a192f 0%, #030a10 100%);
            transition: opacity 0.5s ease;
        }

        .screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .hud-card {
            width: 100%;
            max-width: 400px;
            padding: 3rem 2rem;
            text-align: center;
            border: 1px solid var(--accent);
            background: rgba(0, 20, 40, 0.6);
            box-shadow: 0 0 20px var(--accent-glow), inset 0 0 20px rgba(0, 240, 255, 0.1);
            backdrop-filter: blur(5px);
            position: relative;
        }

        /* SciFi Corners */
        .hud-card::before, .hud-card::after {
            content: ''; position: absolute; width: 20px; height: 20px; border: 2px solid var(--accent);
        }
        .hud-card::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .hud-card::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }

        h1 {
            font-size: 2rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 2rem;
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .btn-group { display: flex; flex-direction: column; gap: 1rem; width: 100%; }

        button {
            width: 100%;
            background: rgba(0, 240, 255, 0.1);
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 1.2rem;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        button:hover {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        input {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-bottom: 2px solid var(--accent);
            padding: 1rem;
            color: var(--accent);
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 2rem;
            outline: none;
            font-family: inherit;
            letter-spacing: 0.2em;
        }
        input:focus { box-shadow: 0 0 10px var(--accent-glow); }

        /* --- Sender View --- */
        #sender-view {
            position: absolute; inset: 0; z-index: 10; display: none; background: #000;
        }

        #video-feed {
            width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1);
            filter: sepia(1) hue-rotate(180deg) saturate(2) brightness(0.4) contrast(1.2);
        }

        /* --- Hologram Image Effect --- */
        .hologram-wrapper {
            position: absolute;
            width: 260px; height: 350px;
            left: 50%; top: 50%;
            margin-left: -130px; margin-top: -175px;
            
            --tx: 0px; --ty: 0px; --s: 1; --r: 0deg;
            transform: translate3d(var(--tx), var(--ty), 0) scale(var(--s)) rotate(var(--r));
            transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
            will-change: transform;
            z-index: 15;
            pointer-events: none;
        }

        .transfer-image {
            width: 100%; height: 100%; object-fit: cover;
            border: 2px solid var(--accent);
            box-shadow: 0 0 30px var(--accent-glow);
            filter: drop-shadow(0 0 10px var(--accent));
            opacity: 0.8;
        }

        /* Scanning Line */
        .hologram-wrapper::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(to bottom, transparent, rgba(0, 240, 255, 0.6) 50%, transparent);
            height: 10px; width: 100%;
            animation: scanline 2s linear infinite;
        }

        @keyframes scanline {
            0% { top: 0%; }
            100% { top: 100%; }
        }

        /* Grabbed State */
        .hologram-wrapper.grabbed {
            --s: 0.7; --r: -5deg;
            transition: transform 0.05s linear;
        }
        .hologram-wrapper.grabbed .transfer-image {
            box-shadow: 0 0 50px #fff, 0 0 80px var(--accent);
            opacity: 1;
            filter: brightness(1.5);
        }

        /* --- Receiver View --- */
        #receiver-view {
            position: absolute; inset: 0; z-index: 5;
            background: radial-gradient(circle at center, #02101a 0%, #000 100%);
            display: none; align-items: center; justify-content: center;
        }

        /* --- High-End Sci-Fi Animations --- */
        
        /* Sender Throwing: Beam up */
        @keyframes beamOut {
            0% { transform: translate3d(var(--tx), var(--ty), 0) scale(0.7) rotate(-5deg); opacity: 1; filter: brightness(1.5); }
            20% { transform: translate3d(var(--tx), var(--ty), 0) scale(0.1, 1.5) rotate(0deg); opacity: 1; }
            100% { transform: translate3d(var(--tx), -120vh, 0) scale(0.01, 3); opacity: 0; filter: blur(10px); }
        }

        /* Receiver Receiving: Portal drop */
        @keyframes materialize {
            0% { transform: translateY(-500px) scale(0.1, 4); opacity: 0; filter: brightness(3); }
            40% { transform: translateY(20px) scale(1.1, 0.9); opacity: 1; filter: brightness(2); }
            70% { transform: translateY(-10px) scale(0.95, 1.05); filter: brightness(1); }
            100% { transform: translateY(0) scale(1, 1); opacity: 0.9; }
        }

        .animate-throw { animation: beamOut 0.5s cubic-bezier(0.7, 0, 1, 1) forwards !important; }
        .animate-receive { 
            position: relative !important; left: auto !important; top: auto !important; margin: 0 !important;
            animation: materialize 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; 
        }

        .status-indicator {
            position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
            font-size: 1rem; color: var(--accent); text-shadow: 0 0 5px var(--accent);
            z-index: 200; text-align: center; width: 100%;
        }

        .room-tag {
            position: fixed; top: 1.5rem; left: 1.5rem; font-size: 1rem;
            color: var(--accent); z-index: 100;
            border: 1px solid var(--accent); padding: 5px 10px; background: rgba(0,240,255,0.1);
        }

        .hidden-permanent { display: none !important; }
    </style>
</head>
<body>

    <div class="scifi-grid"></div>

    <div id="setup-screen" class="screen">
        <div class="hud-card">
            <h1>AETHER</h1>
            <div id="step-1" class="btn-group">
                <button onclick="app.setRole('send')">INITIALIZE TRANSMITTER</button>
                <button onclick="app.setRole('receive')">ACTIVATE RECEIVER</button>
            </div>
            <div id="step-2" class="hidden" style="width: 100%;">
                <input type="text" id="room-input" placeholder="PORTAL ID" maxlength="4">
                <input type="text" id="url-input" placeholder="PAYLOAD (IMG URL)" value="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop">
                <button id="start-btn" onclick="app.initialize()">ENGAGE LINK</button>
            </div>
        </div>
    </div>

    <!-- SENDER SIDE -->
    <div id="sender-view">
        <video id="video-feed" playsinline></video>
        
        <!-- Hologram Element -->
        <div id="holo-wrap" class="hologram-wrapper">
            <img id="sender-img" class="transfer-image" src="" alt="Payload">
        </div>

        <div class="status-indicator" id="sender-status">SYSTEM READY: GRIP TO ACQUIRE TARGET</div>
    </div>

    <!-- RECEIVER SIDE (NO CAMERA NEEDED) -->
    <div id="receiver-view">
        <div class="scifi-grid"></div>
        <div id="receiver-container"></div>
        <div class="status-indicator" id="receiver-status">AWAITING SPATIAL ANOMALY...</div>
    </div>

    <div id="room-display" class="room-tag hidden"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

        // Your provided Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyBxc_mSE5Z-5vvLA8_8EOFuueERi8eY63U",
            authDomain: "tokji-3b05a.firebaseapp.com",
            databaseURL: "https://tokji-3b05a-default-rtdb.firebaseio.com",
            projectId: "tokji-3b05a",
            storageBucket: "tokji-3b05a.firebasestorage.app",
            messagingSenderId: "743789412997",
            appId: "1:743789412997:web:be9196bd3dd574ef879fec"
        };

        const fApp = initializeApp(firebaseConfig);
        const db = getDatabase(fApp);

        const app = {
            role: null, roomId: null, imageUrl: '',
            isTransferring: false, isGrabbed: false,
            holoWrap: null, imgEl: null,
            lastSignalId: null,

            setRole(role) {
                this.role = role;
                document.getElementById('step-1').classList.add('hidden');
                document.getElementById('step-2').classList.remove('hidden');
                if (role === 'send') {
                    document.getElementById('room-input').value = Math.floor(1000 + Math.random() * 9000);
                } else {
                    document.getElementById('url-input').style.display = 'none';
                    document.getElementById('start-btn').innerText = 'LINK PORTAL';
                }
            },

            async initialize() {
                this.roomId = document.getElementById('room-input').value.trim();
                this.imageUrl = document.getElementById('url-input').value.trim();
                
                if (!this.roomId) return alert("ENTER PORTAL ID");

                document.getElementById('setup-screen').classList.add('hidden');
                document.getElementById('room-display').innerText = `PORTAL: ${this.roomId}`;
                document.getElementById('room-display').classList.remove('hidden');

                if (this.role === 'send') {
                    this.initSender();
                } else {
                    this.initReceiver();
                }
            },

            initSender() {
                const view = document.getElementById('sender-view');
                const video = document.getElementById('video-feed');
                
                this.holoWrap = document.getElementById('holo-wrap');
                this.imgEl = document.getElementById('sender-img');
                
                view.style.display = 'block';
                this.imgEl.src = this.imageUrl;

                const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
                hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });
                hands.onResults((results) => this.processHands(results));

                const camera = new Camera(video, {
                    onFrame: async () => { await hands.send({image: video}); },
                    width: 1280, height: 720
                });
                camera.start();
            },

            initReceiver() {
                document.getElementById('receiver-view').style.display = 'flex';
                
                // BULLETPROOF SYNC: Listen for distinct actions, not just status strings
                const signalRef = ref(db, `aether/${this.roomId}/signal`);
                
                onValue(signalRef, (snapshot) => {
                    const data = snapshot.val();
                    // If a new signal arrives that we haven't seen yet
                    if (data && data.action === 'throw' && data.id !== this.lastSignalId) {
                        this.lastSignalId = data.id; // Remember this signal so we don't repeat it
                        this.handleIncoming(data.url);
                    }
                });
            },

            processHands(results) {
                if (this.isTransferring) return;

                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const landmarks = results.multiHandLandmarks[0];
                    const wrist = landmarks[0];
                    const palm = landmarks[9]; 
                    
                    const screenX = (1 - palm.x) * window.innerWidth;
                    const screenY = palm.y * window.innerHeight;

                    const fingerPairs = [[8, 6], [12, 10], [16, 14], [20, 18]]; 
                    let foldedCount = 0;
                    
                    fingerPairs.forEach(([tipIdx, pipIdx]) => {
                        const tip = landmarks[tipIdx];
                        const pip = landmarks[pipIdx];
                        const distTip = Math.hypot(tip.x - wrist.x, tip.y - wrist.y);
                        const distPip = Math.hypot(pip.x - wrist.x, pip.y - wrist.y);
                        if (distTip < distPip) foldedCount++;
                    });

                    // GRAB LOGIC
                    if (foldedCount >= 3) {
                        if (!this.isGrabbed) {
                            this.isGrabbed = true;
                            this.holoWrap.classList.add('grabbed');
                            document.getElementById('sender-status').innerText = "TARGET LOCKED - OPEN HAND TO TRANSMIT";
                            if ("vibrate" in navigator) navigator.vibrate(10);
                        }
                        
                        const tx = screenX - window.innerWidth / 2;
                        const ty = screenY - window.innerHeight / 2;
                        this.holoWrap.style.setProperty('--tx', `${tx}px`);
                        this.holoWrap.style.setProperty('--ty', `${ty}px`);

                    } 
                    // THROW LOGIC (Open hand)
                    else if (foldedCount <= 1 && this.isGrabbed) {
                        this.triggerSend();
                    }
                }
            },

            triggerSend() {
                this.isTransferring = true;
                this.isGrabbed = false;
                
                const status = document.getElementById('sender-status');
                status.innerText = "TRANSMITTING DATA...";

                this.holoWrap.classList.remove('grabbed');
                this.holoWrap.classList.add('animate-throw');

                // BULLETPROOF FIREBASE SYNC: Send a unique ID (Date.now())
                // This ensures the receiver instantly detects a "change" even if status was already 'sent'
                set(ref(db, `aether/${this.roomId}/signal`), {
                    action: 'throw',
                    url: this.imageUrl,
                    id: Date.now() 
                });

                setTimeout(() => {
                    this.holoWrap.classList.add('hidden-permanent');
                    status.innerText = "TRANSMISSION COMPLETE";
                }, 600);
            },

            handleIncoming(url) {
                const container = document.getElementById('receiver-container');
                const status = document.getElementById('receiver-status');
                
                status.innerText = "ANOMALY DETECTED!";
                container.innerHTML = ''; // Clear previous
                
                const wrap = document.createElement('div');
                wrap.className = 'hologram-wrapper animate-receive';
                
                const img = document.createElement('img');
                img.src = url;
                img.className = 'transfer-image';
                
                wrap.appendChild(img);
                container.appendChild(wrap);
                
                if ("vibrate" in navigator) navigator.vibrate([40, 80, 150]);
                
                setTimeout(() => {
                    status.innerText = "PAYLOAD RECEIVED SUCCESSFULLY";
                }, 1000);
            }
        };

        window.app = app;
    </script>
</body>
</html>
