<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear & Natural Voice</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 350px;
        }
        h2 { text-align: center; margin-top: 0; }
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 20px;
        }
        #stopBtn { background-color: #ef4444; display: none; }
        .control-group { margin-bottom: 15px; }
        label { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; color: #9ca3af; }
        input[type=range] { width: 100%; accent-color: #3b82f6; }
    </style>
</head>
<body>

<div class="container">
    <h2>Pro Voice Changer</h2>
    <button id="startBtn">Start Mic</button>
    <button id="stopBtn">Stop Mic</button>

    <div class="control-group">
        <label>Pitch (Bhaar): <span id="pitchVal">-2</span></label>
        <input type="range" id="pitchSlider" min="-6" max="0" value="-2" step="0.5">
    </div>
    
    <div class="control-group">
        <label>Bass (Gehraayi): <span id="bassVal">2</span></label>
        <input type="range" id="bassSlider" min="0" max="10" value="2" step="1">
    </div>

    <div class="control-group">
        <label>Clarity (Saaf Aawaz): <span id="clarityVal">2</span></label>
        <input type="range" id="claritySlider" min="0" max="10" value="2" step="1">
    </div>
</div>

<script>
    let mic, gate, compressor, eq, pitchShift;

    document.getElementById('startBtn').addEventListener('click', async () => {
        await Tone.start(); 

        mic = new Tone.UserMedia({ echoCancellation: true, noiseSuppression: true });

        // 1. GATE: Hawa aur background noise ko block karega bina aawaz kaate
        gate = new Tone.Gate(-45, 0.05);

        // 2. COMPRESSOR: Aawaz ko fatne se rokega (No dirty/distorted sound)
        compressor = new Tone.Compressor({ threshold: -24, ratio: 4 });

        // 3. EQ: Bass (bhaar) aur Clarity (saaf shabd) balance karne ke liye
        eq = new Tone.EQ3({
            low: parseFloat(document.getElementById('bassSlider').value),
            mid: 0,
            high: parseFloat(document.getElementById('claritySlider').value)
        });

        // 4. PITCH SHIFT: Window size chota kiya hai taaki natural lage
        pitchShift = new Tone.PitchShift({
            pitch: parseFloat(document.getElementById('pitchSlider').value),
            windowSize: 0.05
        });

        // AUDIO CHAIN
        mic.connect(gate);
        gate.connect(compressor);
        compressor.connect(eq);
        eq.connect(pitchShift);
        pitchShift.toDestination();

        try {
            await mic.open();
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'block';
        } catch (e) {
            alert("Mic Error! Please allow mic access.");
        }
    });

    document.getElementById('stopBtn').addEventListener('click', () => {
        if (mic) {
            mic.close();
            gate.dispose(); compressor.dispose(); eq.dispose(); pitchShift.dispose();
        }
        document.getElementById('startBtn').style.display = 'block';
        document.getElementById('stopBtn').style.display = 'none';
    });

    // Live Slider Updates
    document.getElementById('pitchSlider').addEventListener('input', (e) => {
        document.getElementById('pitchVal').innerText = e.target.value;
        if (pitchShift) pitchShift.pitch = parseFloat(e.target.value);
    });

    document.getElementById('bassSlider').addEventListener('input', (e) => {
        document.getElementById('bassVal').innerText = e.target.value;
        if (eq) eq.low.value = parseFloat(e.target.value);
    });

    document.getElementById('claritySlider').addEventListener('input', (e) => {
        document.getElementById('clarityVal').innerText = e.target.value;
        if (eq) eq.high.value = parseFloat(e.target.value);
    });
</script>
</body>
</html>
