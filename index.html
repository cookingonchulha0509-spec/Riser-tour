<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Voice Changer (No Air/Noise)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: center;
            width: 350px;
        }
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 20px;
        }
        #stopBtn {
            background-color: #ef4444;
            display: none;
        }
        .status {
            font-size: 14px;
            color: #10b981; /* Matte green for active status */
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Smart Voice Filter</h2>
    <div id="status" class="status">Listening... (Air/Noise Blocked)</div>
    <button id="startBtn">Start Smart Mic</button>
    <button id="stopBtn">Stop Mic</button>
</div>

<script>
    let mic, pitchShift, eq, gate, filter;

    document.getElementById('startBtn').addEventListener('click', async () => {
        await Tone.start(); 

        mic = new Tone.UserMedia({
            echoCancellation: true,
            noiseSuppression: true
        });

        // 1. GATE: Yeh -40 decibel se neeche ki aawaz (hawa, background shor) ko block kar dega
        gate = new Tone.Gate(-40, 0.1);

        // 2. FILTER: Insaan ki aawaz normally 85Hz se 255Hz ke beech hoti hai. Yeh sirf us frequency ko pass hone dega.
        filter = new Tone.Filter({
            type: "bandpass",
            frequency: 150, 
            Q: 1.5
        });

        // 3. Purana Pitch aur EQ effect
        pitchShift = new Tone.PitchShift({ pitch: -4 });
        eq = new Tone.EQ3({ low: 5, mid: 0, high: -2 });

        // Audio Connection: Mic -> Gate (blocks air) -> Filter (human range) -> EQ -> Pitch
        mic.connect(gate);
        gate.connect(filter);
        filter.connect(eq);
        eq.connect(pitchShift);
        pitchShift.toDestination();

        try {
            await mic.open();
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'block';
            document.getElementById('status').style.display = 'block';
        } catch (e) {
            alert("Mic error! Localhost ya HTTPS zaroori hai.");
        }
    });

    document.getElementById('stopBtn').addEventListener('click', () => {
        if (mic) {
            mic.close();
            gate.dispose();
            filter.dispose();
            pitchShift.dispose();
            eq.dispose();
        }
        document.getElementById('startBtn').style.display = 'block';
        document.getElementById('stopBtn').style.display = 'none';
        document.getElementById('status').style.display = 'none';
    });
</script>
</body>
</html>
