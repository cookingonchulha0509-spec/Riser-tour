<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Cam - True Pixel Engine</title>
    <style>
        /* Strict Dark & Clean Theme - No Neon, No Clutter */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background-color: #000000; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        #viewfinder { flex: 1; position: relative; background: #111; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; object-fit: cover; }
        canvas { display: none; } 
        
        #result-view { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; background: #000; }
        #result-img { width: 100%; height: 100%; object-fit: cover; }
        
        #controls-container { background: #0a0a0a; border-top: 1px solid #222; padding: 20px 15px 35px 15px; z-index: 20; display: flex; flex-direction: column; gap: 20px; }
        
        .mode-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; justify-content: center; scrollbar-width: none; }
        .mode-btn { background: #1a1a1a; border: 1px solid #333; color: #888; padding: 10px 18px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: 0.2s; white-space: nowrap; }
        .mode-btn.active { background: #ffffff; color: #000000; border-color: #ffffff; font-weight: 600; }
        
        .action-bar { display: flex; justify-content: space-around; align-items: center; }
        .side-btn { background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 8px; font-size: 14px; padding: 10px 20px; cursor: pointer; visibility: hidden; }
        
        #shutter-btn { width: 70px; height: 70px; border-radius: 50%; background: #ffffff; border: 4px solid #444; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        #shutter-btn:active { transform: scale(0.95); }
        
        #loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); color: #fff; padding: 15px 25px; border-radius: 8px; font-size: 14px; display: none; z-index: 30; border: 1px solid #333; }
    </style>
</head>
<body>

    <div id="loader">Processing Pixels...</div>

    <div id="viewfinder">
        <video id="camera-stream" autoplay playsinline></video>
        <canvas id="process-canvas"></canvas>
        <div id="result-view"><img id="result-img" alt="Captured"></div>
    </div>

    <div id="controls-container">
        <div class="mode-scroll" id="mode-selector">
            <button class="mode-btn active" data-mode="raw">Raw (No Edit)</button>
            <button class="mode-btn" data-mode="s24">S24 (True Boost)</button>
            <button class="mode-btn" data-mode="iphone">iPhone (True Tone)</button>
        </div>

        <div class="action-bar">
            <button class="side-btn" id="retake-btn">Retake</button>
            <div id="shutter-btn"></div>
            <button class="side-btn" id="save-btn">Save</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('camera-stream');
        const canvas = document.getElementById('process-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const shutterBtn = document.getElementById('shutter-btn');
        const retakeBtn = document.getElementById('retake-btn');
        const saveBtn = document.getElementById('save-btn');
        const resultView = document.getElementById('result-view');
        const resultImg = document.getElementById('result-img');
        const modeBtns = document.querySelectorAll('.mode-btn');
        const loader = document.getElementById('loader');

        let currentMode = 'raw';
        let stream;

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } 
                });
                video.srcObject = stream;
            } catch (err) {
                alert("Camera access failed!");
            }
        }

        modeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                modeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = btn.getAttribute('data-mode');
            });
        });

        // REAL PIXEL MATH (Not CSS Fake Filters)
        function processPixels(imageData, mode) {
            const data = imageData.data;
            
            // Default Values
            let gamma = 1.0; 
            let contrast = 1.0; 
            let saturation = 1.0;

            if (mode === 's24') {
                gamma = 1.2;      // Lifts shadows slightly
                contrast = 1.15;  // Punchy
                saturation = 1.25; // Vibrant colors
            } else if (mode === 'iphone') {
                gamma = 1.05;     // Natural light
                contrast = 1.1;   // Deep blacks
                saturation = 1.05; 
            } else {
                return imageData; // Raw
            }

            const contrastFactor = (259 * (contrast * 255 + 255)) / (255 * (259 - contrast * 255));

            for (let i = 0; i < data.length; i += 4) {
                let r = data[i];
                let g = data[i + 1];
                let b = data[i + 2];

                // 1. Gamma Correction (Fixing dark images mathematically)
                r = 255 * Math.pow(r / 255, 1 / gamma);
                g = 255 * Math.pow(g / 255, 1 / gamma);
                b = 255 * Math.pow(b / 255, 1 / gamma);

                // 2. Contrast adjustment
                r = contrastFactor * (r - 128) + 128;
                g = contrastFactor * (g - 128) + 128;
                b = contrastFactor * (b - 128) + 128;

                // 3. Saturation adjustment
                const gray = 0.2989 * r + 0.5870 * g + 0.1140 * b;
                r = gray + saturation * (r - gray);
                g = gray + saturation * (g - gray);
                b = gray + saturation * (b - gray);

                // Clamp values between 0 and 255
                data[i] = Math.min(255, Math.max(0, r));
                data[i + 1] = Math.min(255, Math.max(0, g));
                data[i + 2] = Math.min(255, Math.max(0, b));
            }
            return imageData;
        }

        shutterBtn.addEventListener('click', () => {
            if (!stream) return;
            
            loader.style.display = 'block';
            
            // Allow UI to update before heavy JS calculation freezes the thread
            setTimeout(() => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                
                // Draw raw image
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // Get Raw Pixels
                let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                
                // Apply True Mathematics
                imageData = processPixels(imageData, currentMode);
                
                // Put Processed Pixels Back
                ctx.putImageData(imageData, 0, 0);
                
                resultImg.src = canvas.toDataURL('image/jpeg', 0.95);
                
                resultView.style.display = 'block';
                shutterBtn.style.visibility = 'hidden';
                retakeBtn.style.visibility = 'visible';
                saveBtn.style.visibility = 'visible';
                loader.style.display = 'none';
                document.getElementById('mode-selector').style.opacity = '0.3';
                document.getElementById('mode-selector').style.pointerEvents = 'none';
            }, 50);
        });

        retakeBtn.addEventListener('click', () => {
            resultView.style.display = 'none';
            shutterBtn.style.visibility = 'visible';
            retakeBtn.style.visibility = 'hidden';
            saveBtn.style.visibility = 'hidden';
            document.getElementById('mode-selector').style.opacity = '1';
            document.getElementById('mode-selector').style.pointerEvents = 'auto';
        });

        saveBtn.addEventListener('click', () => {
            const a = document.createElement('a');
            a.href = resultImg.src;
            a.download = `ProCam_True_${currentMode}_${Date.now()}.jpg`;
            a.click();
        });

        window.addEventListener('load', startCamera);
    </script>
</body>
</html>
